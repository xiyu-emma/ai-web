<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}音訊 AI 分析平台{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 這裡可以放頁面特定的額外樣式 */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('main.index') }}" class="brand-logo" style="margin-right: 2rem;">
                🐋 AIWeb <span class="brand-subtitle">聲景分析平台</span>
            </a>
            <div class="nav-links" style="display: flex; align-items: center; flex: 1;">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}" style="margin-left: 0;">上傳分析</a>
                    <a href="{{ url_for('main.history') }}" class="{{ 'active' if request.endpoint == 'main.history' }}">歷史紀錄</a>
                    <a href="{{ url_for('main.training_status') }}" class="{{ 'active' if request.endpoint == 'main.training_status' }}">模型訓練</a>
                    
                    <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
                        <span style="color: rgba(255, 255, 255, 0.9); font-size: 14px; font-weight: 500;">Hi, {{ current_user.username }}</span>
                        <a href="{{ url_for('main.logout') }}" style="color: #ff6f61; font-size: 14px; margin-left: 0; padding: 6px 12px; border: 1px solid #ff6f61; border-radius: 6px; transition: all 0.3s ease;">登出</a>
                    </div>
                {% else %}
                    <div style="margin-left: auto;">
                        <a href="{{ url_for('main.login') }}" class="{{ 'active' if request.endpoint == 'main.login' }}">登入</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; All rights reserved.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
